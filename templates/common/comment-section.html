{% load static %}

{% for comment in photo.comment_set.all %}
<div class="comments">
    <div class="top">
        <div class="userDetails">
            <div class="comment-data">
                <div class="profilepic">
                    <div class="profile_img">
                        <div class="image">
                            {% if not comment.user.profile.profile_picture %}
                                <img src="{% static 'images/person.png' %}" alt="img8">
                            {% else %}
                                <img src="{{ comment.user.profile.profile_picture }}" alt="">
                            {% endif %}
                        </div>
                    </div>
                </div>
                <p>
                    <!-- Link to User Profile Details Page-->
                    <!-- User First and/or Last Name or username-->
                    <a href="{% url 'profile-details' comment.user.pk %}">{{ photo.user.profile.full_name }}</a>
                    <!-- User Comment -->
                    - {{ comment.text }}
                </p>
            </div>
            <span>{{ comment.date_and_time_of_publication|date:"M. d, Y, H:m" }}</span>
        </div>
    </div>
</div>
{% endfor %}
